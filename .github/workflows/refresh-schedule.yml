# Not part of the current local-first setup (docs/ARCHITECTURE.md §6,
# docs/SETUP.md) — the project runs via server.js's own in-process
# node-cron scheduler instead. The `schedule` trigger below is
# deliberately disabled (not just documented as unused) so this doesn't
# silently fire daily scrapes against 22 external employer sites from
# GitHub's runners with no one watching. Re-enable only if/when a fully
# cloud-hosted phase is deliberately taken on — this predates and doesn't
# match today's architecture (it still commits data/, which is gitignored).
name: Daily BFSI Job Board Refresh

on:
  # schedule:
  #   # 00:30 UTC = 06:00 IST (Asia/Kolkata is UTC+5:30, no DST)
  #   - cron: '30 0 * * *'
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Asia/Kolkata
      LOG_LEVEL: info
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run refresh
        run: node refresh.js

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ || true
          git diff --cached --quiet || git commit -m "chore: daily refresh $(date -u +'%Y-%m-%d')"

      - name: Push changes
        run: git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-logs-${{ github.run_id }}
          path: logs/*.log
          retention-days: 14

      - name: Notify Slack on failure
        if: failure() && env.SLACK_WEBHOOK != ''
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"BFSI job board refresh failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$SLACK_WEBHOOK"
