<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%A7%AD</text></svg>">
<title>Employers · India GCC Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #11284B; --canvas: #F3F6FB; --surface: #FFFFFF; --surface-alt: #EDF1F8; --line: #D9E0EC;
    --text: #172033; --text-muted: #5A6578; --cobalt: #2D5BE3; --cobalt-soft: #E6EDFD;
    --high: #0E9F6E; --high-soft: #DDF4EA; --mid: #C9821C; --mid-soft: #FBEEDA; --low-soft: #E9ECF1;
    --critical: #C4402F; --critical-soft: #FBE5E1; --on-ink: #FFFFFF; --on-ink-muted: #B9C6DC;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #0B1A31; --canvas: #0F1726; --surface: #172235; --surface-alt: #1D2A40; --line: #2A3A55;
      --text: #E7ECF5; --text-muted: #9AA7BD; --cobalt: #7FA0FF; --cobalt-soft: #1E2C4F;
      --high: #4CC99B; --high-soft: #143A2E; --mid: #F0B357; --mid-soft: #3A2C14; --low-soft: #243045;
      --critical: #F08A7B; --critical-soft: #3D211D; --on-ink: #FFFFFF; --on-ink-muted: #9FB0CC;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ink: #0B1A31; --canvas: #0F1726; --surface: #172235; --surface-alt: #1D2A40; --line: #2A3A55;
    --text: #E7ECF5; --text-muted: #9AA7BD; --cobalt: #7FA0FF; --cobalt-soft: #1E2C4F;
    --high: #4CC99B; --high-soft: #143A2E; --mid: #F0B357; --mid-soft: #3A2C14; --low-soft: #243045;
    --critical: #F08A7B; --critical-soft: #3D211D; --on-ink: #FFFFFF; --on-ink-muted: #9FB0CC;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--canvas); }
  body { margin: 0; color: var(--text); font-family: 'Source Sans 3', 'Segoe UI', system-ui, sans-serif; font-size: 17px; line-height: 1.5; }
  :focus-visible { outline: 3px solid var(--cobalt); outline-offset: 2px; }
  .wrap { max-width: 1440px; margin: 0 auto; padding-inline: clamp(16px, 3vw, 40px); }
  .masthead { background: var(--ink); color: var(--on-ink); padding-block: 24px 26px; }
  .masthead a { color: var(--on-ink-muted); }
  .masthead a:hover { color: var(--on-ink); }
  h1 { margin: 8px 0 4px; font-size: clamp(26px, 3vw, 34px); font-weight: 700; }
  .summary { margin: 0; color: var(--on-ink-muted); }
  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 18px; }
  .search { flex: 1 1 280px; min-width: 0; padding: 12px 16px; font: inherit; border-radius: 10px; border: 0; background: var(--surface); color: var(--text); }
  main { padding-block: 24px 64px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
  .tab { font: inherit; padding: 10px 14px; border: 0; background: none; color: var(--text-muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; }
  .tab[aria-pressed="true"] { color: var(--text); font-weight: 700; border-bottom-color: var(--cobalt); }
  .tab .n { margin-left: 4px; font-weight: 400; color: var(--text-muted); }
  .table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 16px; }
  th, td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 15px; color: var(--text-muted); font-weight: 600; background: var(--surface-alt); position: sticky; top: 0; }
  tr:last-child td { border-bottom: 0; }
  td.name { font-weight: 600; white-space: nowrap; }
  td.reason { color: var(--text-muted); max-width: 52ch; }
  .pill { display: inline-block; font-size: 14px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
  .pill.bfsi { background: var(--cobalt-soft); color: var(--cobalt); }
  .pill.other { background: var(--low-soft); color: var(--text-muted); }
  .pill.on { background: var(--high-soft); color: var(--high); }
  .pill.off { background: var(--mid-soft); color: var(--mid); }
  .pill.blocked { background: var(--critical-soft); color: var(--critical); }
  a.site { color: var(--cobalt); word-break: break-all; }
  .empty { padding: 32px; text-align: center; color: var(--text-muted); }
</style>
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <a href="/">← Back to the board</a>
    <h1>Employers</h1>
    <p class="summary" id="summary">Loading…</p>
    <div class="controls">
      <input type="search" class="search" id="search" placeholder="Search by employer, platform or reason" aria-label="Search employers">
    </div>
  </div>
</header>

<main class="wrap">
  <div class="tabs" role="group" aria-label="Show employers">
    <button class="tab" data-tab="active" aria-pressed="true">Automated<span class="n" id="nActive"></span></button>
    <button class="tab" data-tab="manual" aria-pressed="false">Check by hand<span class="n" id="nManual"></span></button>
    <button class="tab" data-tab="excluded" aria-pressed="false">Excluded<span class="n" id="nExcluded"></span></button>
  </div>
  <div class="table-wrap"><table id="table"></table></div>
</main>

<script>
(function () {
  var PLATFORM = { workday: 'Workday', oracle: 'Oracle Fusion', greenhouse: 'Greenhouse', avature: 'Avature', custom: 'Custom (sitemap)',
    successfactors: 'SuccessFactors', phenom: 'Phenom', eightfold: 'Eightfold', icims: 'iCIMS', taleo: 'Taleo', unknown: 'Not known' };
  var data = { employers: [], excluded: [] };
  var tab = 'active';
  var query = '';

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function safeUrl(u) { return /^https?:\/\//i.test(u || '') ? u : '#'; }
  // The first sentence of a dated note, without the date prefix.
  function reason(note) {
    var n = String(note || '').replace(/^Verified \d{4}-\d{2}-\d{2}:?\s*|^\d{4}-\d{2}-\d{2}:\s*/, '');
    return (n.split(/(?<=\.)\s/)[0] || '').slice(0, 220);
  }
  function matches(text) { return !query || text.toLowerCase().indexOf(query) !== -1; }

  function render() {
    var table = document.getElementById('table');
    var rows;
    if (tab === 'excluded') {
      rows = data.excluded.filter(function (e) { return matches(e.name + ' ' + e.reason); });
      table.innerHTML = '<thead><tr><th>Employer</th><th>Status</th><th>Reason</th></tr></thead><tbody>' +
        rows.map(function (e) {
          return '<tr><td class="name">' + esc(e.name) + '</td><td><span class="pill blocked">Not permitted</span></td><td class="reason">' + esc(e.reason) + '</td></tr>';
        }).join('') + '</tbody>';
    } else {
      var active = tab === 'active';
      rows = data.employers
        .filter(function (e) { return e.active === active; })
        .filter(function (e) { return matches(e.name + ' ' + (PLATFORM[e.ats_type] || e.ats_type) + ' ' + e.sector + ' ' + reason(e.note)); })
        .sort(function (a, b) { return a.name.localeCompare(b.name); });
      table.innerHTML = '<thead><tr><th>Employer</th><th>Sector</th><th>Platform</th>' + (active ? '' : '<th>Why it is not automated</th>') + '<th>Career site</th></tr></thead><tbody>' +
        rows.map(function (e) {
          return '<tr><td class="name">' + esc(e.name) + '</td>' +
            '<td><span class="pill ' + (e.sector === 'BFSI' ? 'bfsi' : 'other') + '">' + esc(e.sector) + '</span></td>' +
            '<td>' + esc(PLATFORM[e.ats_type] || e.ats_type) + '</td>' +
            (active ? '' : '<td class="reason">' + esc(reason(e.note)) + '</td>') +
            '<td><a class="site" href="' + esc(safeUrl(e.careers_url)) + '" target="_blank" rel="noopener noreferrer">' + esc(String(e.careers_url).replace(/^https?:\/\//, '').replace(/\/$/, '')) + '</a></td></tr>';
        }).join('') + '</tbody>';
    }
    if (!rows.length) table.innerHTML = '<tbody><tr><td class="empty">No employers match this search.</td></tr></tbody>';
  }

  document.getElementById('search').addEventListener('input', function (e) { query = e.target.value.trim().toLowerCase(); render(); });
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (b) {
    b.addEventListener('click', function () {
      Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) { t.setAttribute('aria-pressed', 'false'); });
      b.setAttribute('aria-pressed', 'true');
      tab = b.getAttribute('data-tab');
      render();
    });
  });

  fetch('/api/employers').then(function (r) {
    if (!r.ok) throw new Error('The employer list did not load.');
    return r.json();
  }).then(function (d) {
    data = d;
    var active = d.employers.filter(function (e) { return e.active; }).length;
    var manual = d.employers.length - active;
    document.getElementById('nActive').textContent = active;
    document.getElementById('nManual').textContent = manual;
    document.getElementById('nExcluded').textContent = d.excluded.length;
    document.getElementById('summary').textContent = (d.employers.length + d.excluded.length) + ' employers: the refresh scrapes ' + active +
      ', you check ' + manual + ' by hand, and ' + d.excluded.length + ' do not permit crawlers.';
    render();
  }).catch(function (err) { document.getElementById('summary').textContent = err.message; });
})();
</script>
</body>
</html>
